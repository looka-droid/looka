name: Собрать APK для RuStore

# Запускается двумя способами:
#  1) вручную — вкладка Actions в репозитории, кнопка «Run workflow»;
#  2) сам, когда меняется что-то в папке android/
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Взять файлы репозитория
        uses: actions/checkout@v4

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3

      # Ключ подписи лежит в секретах репозитория одной строкой.
      # Здесь он превращается обратно в файл рядом со сборкой.
      - name: Достать ключ подписи
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/keystore.jks
            echo "ключ подписи на месте"
          else
            echo "ключа нет — соберу неподписанный APK (для RuStore он не подойдёт)"
          fi

      - name: Собрать
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Номер сборки растёт сам: RuStore не примет обновление
          # с тем же номером, а забыть его поднять — обычное дело.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          # gradlew теперь лежит в репозитории, ставить Gradle на машину не нужно
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Показать, что получилось
        working-directory: android
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Положить APK в результаты сборки
        uses: actions/upload-artifact@v4
        with:
          name: looka-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
