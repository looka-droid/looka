name: Собрать APK для RuStore

# Запускается двумя способами:
#  1) вручную — вкладка Actions в репозитории, кнопка «Run workflow»;
#  2) сам, когда меняется что-то в папке android/
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Взять файлы репозитория
        uses: actions/checkout@v4

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Раньше здесь стоял готовый шаг android-actions/setup-android.
      # Он падал: просил пакет 'tools', которого в свежих версиях SDK
      # больше нет. Доустанавливать ничего и не надо — на машинах GitHub
      # Android SDK уже стоит. Просто проверяем, что он на месте, и
      # принимаем лицензии, без которых сборка откажется работать.
      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK на машине не найден"; exit 1
          fi
          echo "--- установленные версии Android ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(папки platforms нет)"
          echo "--- установленные build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(папки build-tools нет)"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "лицензии приняты"

      # Ключ подписи лежит в секретах репозитория одной строкой.
      # Здесь он превращается обратно в файл рядом со сборкой.
      #
      # Раньше при отсутствии ключа сборка молча продолжалась и выдавала
      # файл с хвостом -unsigned. Такой APK не ставится на телефон вообще,
      # и человек узнаёт об этом, только когда скачает его и попробует.
      # Поэтому теперь останавливаемся сразу и говорим, чего не хватает.
      - name: Достать ключ подписи
        env:
          KS:    ${{ secrets.KEYSTORE_BASE64 }}
          KSPW:  ${{ secrets.KEYSTORE_PASSWORD }}
          KSAL:  ${{ secrets.KEY_ALIAS }}
        run: |
          MISS=""
          [ -z "$KS"   ] && MISS="$MISS KEYSTORE_BASE64"
          [ -z "$KSPW" ] && MISS="$MISS KEYSTORE_PASSWORD"
          [ -z "$KSAL" ] && MISS="$MISS KEY_ALIAS"
          if [ -n "$MISS" ]; then
            echo "::error::Нет секретов:$MISS — без них APK будет неподписанным и не установится."
            echo ""
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Нужны четыре: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/keystore.jks
          if [ ! -s android/app/keystore.jks ]; then
            echo "::error::KEYSTORE_BASE64 не разобрался в файл — скопировалась не вся строка?"
            exit 1
          fi
          echo "ключ подписи на месте, размер $(stat -c%s android/app/keystore.jks) байт"

      - name: Собрать
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Номер сборки растёт сам: RuStore не примет обновление
          # с тем же номером, а забыть его поднять — обычное дело.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          # gradlew теперь лежит в репозитории, ставить Gradle на машину не нужно
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Показать, что получилось
        working-directory: android
        run: |
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;
          # подстраховка: если вдруг всё же собралось без подписи — не отдаём
          if find app/build/outputs -name '*-unsigned.apk' | grep -q .; then
            echo "::error::APK получился неподписанным — на телефон он не встанет."
            exit 1
          fi

      - name: Положить APK в результаты сборки
        uses: actions/upload-artifact@v4
        with:
          name: looka-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
