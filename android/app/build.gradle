plugins {
    id 'com.android.application'
}

/* Ключ подписи. На GitHub он приезжает из секретов репозитория.
   Если его нет (например, вы собираете у себя для пробы), сборка не падает —
   просто получится неподписанный APK, который годится для проверки на телефоне,
   но не годится для RuStore. */
def ksFile = file("keystore.jks")
def hasKs = ksFile.exists() &&
        System.getenv("KEYSTORE_PASSWORD") != null &&
        System.getenv("KEY_ALIAS") != null

android {
    namespace 'ru.looka.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.looka.app"
        minSdk 24
        targetSdk 34
        /* versionCode увеличивается при каждой сборке на GitHub автоматически.
           RuStore не примет обновление с тем же номером. */
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("VERSION_NAME") ?: "1.0"
    }

    if (hasKs) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKs) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
