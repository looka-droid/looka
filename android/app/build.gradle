plugins {
    id 'com.android.application'
}

/* Ключ подписи. На GitHub он приезжает из секретов репозитория.
   Если его нет (например, вы собираете у себя для пробы), сборка не падает —
   просто получится неподписанный APK, который годится для проверки на телефоне,
   но не годится для RuStore. */
/* Номер и название сборки считаем заранее, отдельными переменными.
   Раньше тут стояло versionCode (System.getenv(...) ?: "1").toInteger() —
   и Groovy из-за пробела перед скобкой понял это как «вызови versionCode
   с этой строкой, а потом у результата возьми toInteger()». Результата
   нет, отсюда и «Value is null». */
def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def vName = System.getenv("VERSION_NAME") ?: "1.0"

def ksFile    = file("keystore.jks")
def ksPass    = System.getenv("KEYSTORE_PASSWORD")
def ksAlias   = System.getenv("KEY_ALIAS")
def keyPass   = System.getenv("KEY_PASSWORD") ?: ksPass
def hasKs     = ksFile.exists() && ksPass != null && ksAlias != null

android {
    namespace 'ru.looka.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.looka.app"
        minSdk 24
        targetSdk 34
        /* versionCode увеличивается при каждой сборке на GitHub автоматически.
           RuStore не примет обновление с тем же номером. */
        versionCode vCode
        versionName vName
    }

    if (hasKs) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKs) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
